---
name: Release

"on":
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag to (re-)release
        required: true
        type: string

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  release:
    name: "Release: GitHub"
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.2.2
    with:
      release_files: rules_graalvm-*.tgz
      prerelease: false
      tag_name: ${{ inputs.tag_name || github.ref_name }}

  publish:
    name: "Release: BCR"
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
