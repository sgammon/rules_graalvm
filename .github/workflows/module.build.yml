---
name: "Build"

"on":
  workflow_dispatch:
    inputs:
      ## Runner to use
      runner:
        description: "Runner"
        type: string
        default: "ubuntu-latest"

      ## Whether to build with bzlmod
      bzlmod:
        description: "Enable Bzlmod"
        type: boolean
        default: false

      ## Whether to run tests
      tests:
        description: "Run Tests"
        type: boolean
        default: true

      ## Whether we should run integration tests (main target)
      main:
        description: "Main target"
        type: boolean
        default: false

      ## Whether we should report coverage
      coverage:
        description: "Coverage"
        type: boolean
        default: false

      ## Bazel version to use
      bazel_version:
        description: "Bazel version"
        type: string
        default: "7.0.0"

      ## Configuration profile to use
      bazel_config:
        description: "Bazel profile"
        type: string
        default: "bazel7"

      ## Additional flags to pass to Bazel
      flags:
        description: "Flags"
        type: string
        default: ""

  workflow_call:
    inputs:
      runner:
        description: "Runner"
        type: string
        default: "ubuntu-latest"
      label:
        description: "Label"
        type: string
        default: "Ubuntu"
      bzlmod:
        description: "Enable Bzlmod"
        type: boolean
        default: false
      tests:
        description: "Run Tests"
        type: boolean
        default: true
      labs:
        description: "Skip Failures"
        type: boolean
        default: false
      bazel_version:
        description: "Bazel version"
        type: string
        default: "7.0.0"
      bazel_config:
        description: "Bazel profile"
        type: string
        default: "bazel7"
      main:
        description: "Main target"
        type: boolean
        default: false
      flags:
        description: "Flags"
        type: string
        default: ""
      coverage:
        description: "Coverage"
        type: boolean
        default: false

    secrets:
      ## Secrets: BuildBuddy API key
      BUILDBUDDY_APIKEY:
        required: false

      ## Secrets: Buildless API key
      BUILDLESS_APIKEY:
        required: false

      ## Secrets: Codecov Reporting Token
      CODECOV_TOKEN:
        required: false

env:
  BUILDLESS_APIKEY: ${{ secrets.BUILDLESS_APIKEY }}
  BUILDBUDDY_APIKEY: ${{ secrets.BUILDBUDDY_APIKEY }}

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.labs }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bazel.less.build:443
            bcr.bazel.build:443
            github.com:443
            github.com:80
            global.less.build:443
            mirror.bazel.build:443
            objects.githubusercontent.com:443
            releases.bazel.build:443
            remote.buildbuddy.io:443
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup: msbuild"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ contains(inputs.runner, 'windows') }}
      - name: "Setup: Bazel"
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # 0.8.3
      - name: "Setup: Cache"
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: "~/.cache/bazel"
          key: bazel-v3
      - name: "Configure: Bazel Services"
        shell: bash
        if: contains(env.BUILDLESS_APIKEY || '', 'user_')
        run: |
          echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_APIKEY }}" >> local.bazelrc
          echo "build --remote_header=x-api-key=${{ secrets.BUILDLESS_APIKEY }}" >> local.bazelrc
      - name: "Configure: Bzlmod"
        if: inputs.bzlmod
        run: |
          echo "build --config=bzlmod" >> local.bazelrc
      - name: "Build: Project"
        continue-on-error: ${{ inputs.labs }}
        shell: bash
        run: bazel build --config=ci ${{ inputs.flags }} "//example/native"
      - name: "Testsuite"
        continue-on-error: ${{ inputs.labs }}
        if: inputs.coverage
        shell: bash
        run: bazel coverage --config=ci ${{ inputs.flags }} "//tools/..." "//tests/..." "//.aspect/..."
      - name: "Report: Coverage"
        uses: codecov/codecov-action@7f8b4b4bde536c465e797be725718b88c5d95e0e # v5.1.1
        if: inputs.coverage
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          flags: tools
          verbose: true
          fail_ci_if_error: true # optional (default = false)

  integration-tests:
    name: ${{ matrix.label }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.labs || matrix.labs }}
    if: inputs.main
    strategy:
      fail-fast: false
      matrix:
        label: ["BCR"]
        target: ["sample"]
        action: ["build"]
        directory: ["./example/integration_tests/bzlmod"]
        labs: [false]
        skip: [false]
        include:
          # Test: BCR Sample
          - label: BCR
            target: sample
            action: build
            directory: "./example/integration_tests/bzlmod"
            labs: false
            skip: false

          # Test: Workspace Sample
          - label: Workspace
            target: sample
            action: build
            directory: "./example/integration_tests/workspace"
            labs: false
            skip: false

          # Test: Bazel 4
          # Skipped on Windows (unsupported). Bazel 4 is past upstream EOL but is kept in the
          # matrix so the legacy WORKSPACE + `graal/graal.bzl` path stays regression-tested.
          - label: Bazel 4
            target: sample
            action: build
            directory: "./example/integration_tests/bazel4"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: Bazel 5
          # Skipped on Windows (unsupported) and macOS (pre-existing wrapped_clang toolchain bug
          # under Bazel 5's local_config_cc on macOS).
          - label: Bazel 5
            target: sample
            action: build
            directory: "./example/integration_tests/bazel5"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') || contains(inputs.runner, 'macos') }}

          # Test: Bazel 6
          # Skipped on macOS (pre-existing `missing LC_UUID` error in local_config_cc wrapped_clang
          # when invoked from inside native-image).
          - label: Bazel 6
            target: sample
            action: build
            directory: "./example/integration_tests/bazel6"
            labs: false
            skip: ${{ contains(inputs.runner, 'macos') }}

          # Test: Bazel 7
          - label: Bazel 7
            target: sample
            action: build
            directory: "./example/integration_tests/bazel7"
            labs: false
            skip: false

          # Test: Bazel 8
          - label: Bazel 8
            target: sample
            action: build
            directory: "./example/integration_tests/bazel8"
            labs: false
            skip: false

          # Test: Bazel 9
          - label: Bazel 9
            target: sample
            action: build
            directory: "./example/integration_tests/bazel9"
            labs: false
            skip: false

          # Test: Inert
          - label: Inert
            target: sample
            action: build
            directory: "./example/integration_tests/inert"
            labs: false
            skip: false

          # Test: Inert Workspace
          - label: Inert Workspace
            target: sample
            action: build
            directory: "./example/integration_tests/inert-workspace"
            labs: false
            skip: false

          # Test: Java Toolchain
          - label: Java Toolchain
            target: sample
            action: build
            directory: "./example/integration_tests/java-toolchain"
            labs: false
            skip: false

          # Test: Shared Library
          - label: Shared Library
            target: sample
            action: build
            directory: "./example/integration_tests/shared-lib"
            labs: false
            skip: false

          # Test: Maven Artifacts
          - label: Maven Artifacts
            target: sample
            action: build
            directory: "./example/integration_tests/maven-artifacts"
            labs: false
            skip: false

          # Test: Legacy Rules
          - label: Legacy Rules
            target: sample
            action: build
            directory: "./example/integration_tests/legacy-rules"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: Legacy GVM
          - label: Legacy GVM
            target: sample
            action: build
            directory: "./example/integration_tests/legacy-gvm"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: Components on CE
          # Skipped on Windows (no gu/bash support) — components rely on the deprecated
          # GraalVM Updater, which does not work on Windows.
          - label: Components (CE)
            target: sample
            action: build
            directory: "./example/integration_tests/components-ce"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: GVM CE 17
          - label: GraalVM CE 17
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-17"
            labs: false
            skip: false

          # Test: GVM CE 21
          - label: GraalVM CE 21
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-21"
            labs: false
            skip: false

          # Test: GVM CE 25
          - label: GraalVM CE 25
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-25"
            labs: false
            skip: false

          # Test: Oracle GVM 17
          - label: Oracle GraalVM 17
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-17"
            labs: false
            skip: false

          # Test: Oracle GVM 21
          - label: Oracle GraalVM 21
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-21"
            labs: false
            skip: false

          # Test: Oracle GVM 25
          - label: Oracle GraalVM 25
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-25"
            labs: false
            skip: false

          # Test: Native Image Layers
          # Exercises the `native_image_layer` rule + `layers` attr on `native_image`.
          # Linux only because the feature is GraalVM 24+ Early Adopter (most stable on Linux)
          # and because CI disk pressure matters (a base layer `.nil` is multi-GB).
          # Target is `libbase` (just the base layer), not `sample`, because consuming the
          # layer from the app hits an upstream mmap bug in GraalVM 25.0.2 (Size exceeds
          # Integer.MAX_VALUE, fixed in PR #13008 — expected in 25.0.3).
          # Bare label form `sample:libbase` (no leading `//`) sidesteps Git Bash MSYS path
          # mangling that collapses `//foo` → `/foo`.
          - label: Native Image Layers
            target: "sample:libbase"
            action: build
            directory: "./example/integration_tests/layers"
            labs: true
            skip: ${{ contains(inputs.runner, 'windows') || contains(inputs.runner, 'macos') }}

          # Test: Custom URL (Early Adopter pathway)
          # Exercises `url_per_platform` / `sha256_per_platform` / `strip_prefix_per_platform`
          # on `graalvm_repository` — the supported path for EA / nightly / dev builds.
          # Targets `mainjvm` (the Java binary) to keep the test fast: it forces the custom
          # URL download and toolchain wiring without running native-image.
          # Skipped on macOS Intel (runner `macos-15-intel`) because the pinned URL set uses
          # GraalVM CE 25.0.2 which does not ship a `macos-x64` build — the rule's per-platform
          # URL check would fail at repo fetch with no matching entry for `macos-x64`.
          # Bare label form `sample:mainjvm` (no leading `//`) sidesteps Git Bash MSYS path
          # mangling that collapses `//foo` → `/foo` on Windows.
          - label: Custom URL
            target: "sample:mainjvm"
            action: build
            directory: "./example/integration_tests/custom-url"
            labs: false
            skip: ${{ contains(inputs.runner, 'intel') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bazel.less.build:443
            bcr.bazel.build:443
            github.com:443
            github.com:80
            global.less.build:443
            mirror.bazel.build:443
            objects.githubusercontent.com:443
            releases.bazel.build:443
            download.oracle.com:443
            gds.oracle.com:443
            remote.buildbuddy.io:443
            objectstorage.*.oraclecloud.com:443
            www.graalvm.org:443
            repo1.maven.org:443
            maven.pkg.st:443
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup: msbuild"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ contains(inputs.runner, 'windows') }}
      - name: "Setup: Bazel"
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # 0.8.3
      - name: "Configure: Bazel Version"
        shell: bash
        if: matrix.skip != true && inputs.bazel_version != '' && inputs.bazel_config != ''
        run: |
          echo "${{ inputs.bazel_version }}" > .bazelversion
          echo "import %workspace%/tools/bazel/${{ inputs.bazel_config }}.bazelrc" > version.bazelrc
      - name: "Configure: Bazel Services"
        shell: bash
        if: contains(env.BUILDLESS_APIKEY || '', 'user_')
        run: |
          echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_APIKEY }}" >> local.bazelrc
          echo "build --remote_header=x-api-key=${{ secrets.BUILDLESS_APIKEY }}" >> local.bazelrc
      - name: "Test: ${{ matrix.label }}"
        if: matrix.skip == false
        continue-on-error: ${{ inputs.labs }}
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: bazel ${{ matrix.action || 'build' }} "${{ matrix.target || '//...' }}"

  # Per-target SDK *file* selection. Resolves the linux/aarch64 GraalVM toolchain from this
  # x86_64 host and asserts every SDK file the toolchain provider surfaces originates from that
  # platform's SDK repo (not the host's) — the cross-platform / RBE bug this guards against.
  # `ctx.actions.write` is in-process, so no executor for the target platform is needed; this is
  # the file-selection assertion and requires no RBE. (A full remote *execution* smoke test on
  # BuildBuddy is tracked separately — it needs RBE-platform exec_properties for the example.)
  sdk-file-selection:
    name: "SDK File Selection"
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.labs }}
    if: inputs.main
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bcr.bazel.build:443
            github.com:443
            github.com:80
            mirror.bazel.build:443
            objects.githubusercontent.com:443
            releases.bazel.build:443
            www.graalvm.org:443
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup: Bazel"
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # 0.8.3
      - name: "Test: per-target SDK file selection (cross-platform)"
        working-directory: ./example/integration_tests/bzlmod_all_platforms
        shell: bash
        run: |
          bazel build //sample:sdk_probe \
            --platforms=//tools/remote:linux_aarch64 \
            --extra_execution_platforms=//tools/remote:linux_aarch64
          out="$(bazel cquery //sample:sdk_probe --output=files \
            --platforms=//tools/remote:linux_aarch64 \
            --extra_execution_platforms=//tools/remote:linux_aarch64 2>/dev/null)"
          bash sample/provenance_test.sh "$out" graalvm_linux_aarch64 libjvm,liblibchelper,libffi
