---
name: "Build"

"on":
  workflow_dispatch:
    inputs:
      ## Runner to use
      runner:
        description: "Runner"
        type: string
        default: "ubuntu-latest"

      ## Whether to build with bzlmod
      bzlmod:
        description: "Enable Bzlmod"
        type: boolean
        default: false

      ## Whether to run tests
      tests:
        description: "Run Tests"
        type: boolean
        default: true

      ## Whether we should run integration tests (main target)
      main:
        description: "Main target"
        type: boolean
        default: false

      ## Whether we should report coverage
      coverage:
        description: "Coverage"
        type: boolean
        default: false

      ## Bazel version to use
      bazel_version:
        description: "Bazel version"
        type: string
        default: "7.0.0"

      ## Configuration profile to use
      bazel_config:
        description: "Bazel profile"
        type: string
        default: "bazel7"

      ## Additional flags to pass to Bazel
      flags:
        description: "Flags"
        type: string
        default: ""

  workflow_call:
    inputs:
      runner:
        description: "Runner"
        type: string
        default: "ubuntu-latest"
      label:
        description: "Label"
        type: string
        default: "Ubuntu"
      bzlmod:
        description: "Enable Bzlmod"
        type: boolean
        default: false
      tests:
        description: "Run Tests"
        type: boolean
        default: true
      labs:
        description: "Skip Failures"
        type: boolean
        default: false
      bazel_version:
        description: "Bazel version"
        type: string
        default: "7.0.0"
      bazel_config:
        description: "Bazel profile"
        type: string
        default: "bazel7"
      main:
        description: "Main target"
        type: boolean
        default: false
      flags:
        description: "Flags"
        type: string
        default: ""
      coverage:
        description: "Coverage"
        type: boolean
        default: false

    secrets:
      ## Secrets: BuildBuddy API key
      BUILDBUDDY_APIKEY:
        required: false

      ## Secrets: Buildless API key
      BUILDLESS_APIKEY:
        required: false

      ## Secrets: Codecov Reporting Token
      CODECOV_TOKEN:
        required: false

env:
  BUILDLESS_APIKEY: ${{ secrets.BUILDLESS_APIKEY }}
  BUILDBUDDY_APIKEY: ${{ secrets.BUILDBUDDY_APIKEY }}

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.labs }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bazel.less.build:443
            bcr.bazel.build:443
            github.com:443
            github.com:80
            global.less.build:443
            mirror.bazel.build:443
            objects.githubusercontent.com:443
            releases.bazel.build:443
            remote.buildbuddy.io:443
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup: msbuild"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ contains(inputs.runner, 'windows') }}
      - name: "Setup: Bazel"
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # 0.8.3
      - name: "Setup: Cache"
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: "~/.cache/bazel"
          key: bazel-v3
      - name: "Configure: Bazel Services"
        shell: bash
        if: contains(env.BUILDLESS_APIKEY || '', 'user_')
        run: |
          echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_APIKEY }}" >> local.bazelrc
          echo "build --remote_header=x-api-key=${{ secrets.BUILDLESS_APIKEY }}" >> local.bazelrc
      - name: "Configure: Bzlmod"
        if: inputs.bzlmod
        run: |
          echo "build --config=bzlmod" >> local.bazelrc
      - name: "Build: Project"
        continue-on-error: ${{ inputs.labs }}
        shell: bash
        run: bazel build --config=ci ${{ inputs.flags }} "//example/native"
      - name: "Testsuite"
        continue-on-error: ${{ inputs.labs }}
        if: inputs.coverage
        shell: bash
        run: bazel coverage --config=ci ${{ inputs.flags }} "//tools/..." "//tests/..." "//.aspect/..."
      - name: "Report: Coverage"
        uses: codecov/codecov-action@7f8b4b4bde536c465e797be725718b88c5d95e0e # v5.1.1
        if: inputs.coverage
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          flags: tools
          verbose: true
          fail_ci_if_error: true # optional (default = false)

  integration-tests:
    name: ${{ matrix.label }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.labs || matrix.labs }}
    if: inputs.main
    strategy:
      fail-fast: false
      matrix:
        label: ["BCR"]
        target: ["sample"]
        action: ["build"]
        directory: ["./example/integration_tests/bzlmod"]
        labs: [false]
        skip: [false]
        include:
          # Test: BCR Sample
          - label: BCR
            target: sample
            action: build
            directory: "./example/integration_tests/bzlmod"
            labs: false
            skip: false

          # Test: Workspace Sample
          - label: Workspace
            target: sample
            action: build
            directory: "./example/integration_tests/workspace"
            labs: false
            skip: false

          # Test: Bazel 7
          - label: Bazel 7
            target: sample
            action: build
            directory: "./example/integration_tests/bazel7"
            labs: false
            skip: false

          # Test: Bazel 8
          - label: Bazel 8
            target: sample
            action: build
            directory: "./example/integration_tests/bazel8"
            labs: false
            skip: false

          # Test: Bazel 9
          - label: Bazel 9
            target: sample
            action: build
            directory: "./example/integration_tests/bazel9"
            labs: false
            skip: false

          # Test: Inert
          - label: Inert
            target: sample
            action: build
            directory: "./example/integration_tests/inert"
            labs: false
            skip: false

          # Test: Inert Workspace
          - label: Inert Workspace
            target: sample
            action: build
            directory: "./example/integration_tests/inert-workspace"
            labs: false
            skip: false

          # Test: Java Toolchain
          - label: Java Toolchain
            target: sample
            action: build
            directory: "./example/integration_tests/java-toolchain"
            labs: false
            skip: false

          # Test: Shared Library
          - label: Shared Library
            target: sample
            action: build
            directory: "./example/integration_tests/shared-lib"
            labs: false
            skip: false

          # Test: Maven Artifacts
          - label: Maven Artifacts
            target: sample
            action: build
            directory: "./example/integration_tests/maven-artifacts"
            labs: false
            skip: false

          # Test: Legacy Rules
          - label: Legacy Rules
            target: sample
            action: build
            directory: "./example/integration_tests/legacy-rules"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: Legacy GVM
          - label: Legacy GVM
            target: sample
            action: build
            directory: "./example/integration_tests/legacy-gvm"
            labs: false
            skip: ${{ contains(inputs.runner, 'windows') }}

          # Test: GVM CE 17
          - label: GraalVM CE 17
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-17"
            labs: false
            skip: false

          # Test: GVM CE 21
          - label: GraalVM CE 21
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-21"
            labs: false
            skip: false

          # Test: GVM CE 25
          # Skipped on Intel macOS: GraalVM stopped shipping macos-x64 archives
          # as of 25.0.2.
          - label: GraalVM CE 25
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-25"
            labs: false
            skip: ${{ contains(inputs.runner, 'intel') }}

          # Test: GVM CE 25.2 ("25 Innovation 2")
          # Skipped on Intel macOS: GraalVM stopped shipping macos-x64 archives
          # as of 25.0.2.
          - label: GraalVM CE 25.2
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-ce-25.2"
            labs: false
            skip: ${{ contains(inputs.runner, 'intel') }}

          # Test: Oracle GVM 17
          - label: Oracle GraalVM 17
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-17"
            labs: false
            skip: false

          # Test: Oracle GVM 21
          - label: Oracle GraalVM 21
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-21"
            labs: false
            skip: false

          # Test: Oracle GVM 25
          # Skipped on Intel macOS: GraalVM stopped shipping macos-x64 archives
          # as of 25.0.2.
          - label: Oracle GraalVM 25
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-25"
            labs: false
            skip: ${{ contains(inputs.runner, 'intel') }}

          # Test: Oracle GVM 25.1 ("25 Innovation 1")
          # Skipped on Intel macOS: GraalVM stopped shipping macos-x64 archives
          # as of 25.0.2.
          - label: Oracle GraalVM 25.1
            target: sample
            action: build
            directory: "./example/integration_tests/graalvm-oracle-25.1"
            labs: false
            skip: ${{ contains(inputs.runner, 'intel') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bazel.less.build:443
            bcr.bazel.build:443
            github.com:443
            github.com:80
            global.less.build:443
            mirror.bazel.build:443
            objects.githubusercontent.com:443
            releases.bazel.build:443
            download.oracle.com:443
            gds.oracle.com:443
            remote.buildbuddy.io:443
            objectstorage.*.oraclecloud.com:443
            www.graalvm.org:443
            repo1.maven.org:443
            maven.pkg.st:443
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup: msbuild"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ contains(inputs.runner, 'windows') }}
      - name: "Setup: Bazel"
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # 0.8.3
      - name: "Configure: Bazel Version"
        shell: bash
        if: matrix.skip != true && inputs.bazel_version != '' && inputs.bazel_config != ''
        run: |
          echo "${{ inputs.bazel_version }}" > .bazelversion
          echo "import %workspace%/tools/bazel/${{ inputs.bazel_config }}.bazelrc" > version.bazelrc
      - name: "Configure: Bazel Services"
        shell: bash
        if: contains(env.BUILDLESS_APIKEY || '', 'user_')
        run: |
          echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_APIKEY }}" >> local.bazelrc
          echo "build --remote_header=x-api-key=${{ secrets.BUILDLESS_APIKEY }}" >> local.bazelrc
      - name: "Test: ${{ matrix.label }}"
        if: matrix.skip == false
        continue-on-error: ${{ inputs.labs }}
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: bazel ${{ matrix.action || 'build' }} "${{ matrix.target || '//...' }}"
