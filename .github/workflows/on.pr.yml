---
name: "PR"

"on":
  ## Run on PR filings; `ready_for_review` re-runs the full suite when a draft is promoted.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**
      - docs/**/*.*
      - example/**/*.*
      - graalvm/**/*.*
      - internal/**/*.*
      - tools/**/*.*
      - "*.bzl"
      - "*.bazel"
      - MODULE.bazel.lock

  ## Run on PR queue check requests
  merge_group: {}

concurrency:
  # Cancel previous actions from the same PR: https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ## Draft PRs get a single Linux build without integration tests; ready PRs and the merge
  ## queue get the full OS x integration-test matrix.
  plan:
    name: "Plan"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      draft: ${{ steps.matrix.outputs.draft }}
    steps:
      - name: "Plan: Test Matrix"
        id: matrix
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          os() { jq -nc --arg r "$1" --arg l "$2" --arg f "$3" --argjson m "$4" --argjson c "$5" \
            '{runner: $r, label: $l, flags: $f, main: $m, coverage: $c, labs: false}'; }
          if [ "$DRAFT" = "true" ]; then
            include="[$(os ubuntu-latest 'Ubuntu amd64 (draft)' --config=linux false false)]"
          else
            include="[$(os ubuntu-latest 'Ubuntu amd64' --config=linux true false),"
            include+="$(os macos-latest 'macOS arm64' --config=mac true true),"
            include+="$(os windows-2022 'Windows amd64' --config=windows true false)]"
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  dependency-graph:
    name: "Dependency Graph"
    needs: [plan]
    if: needs.plan.outputs.draft != 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Report: Dependency Graph"
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@4f64ddab9d742a4806eeb588d238e4c311a8397d # v4.1.1

  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-latest
    needs: [plan, dependency-graph]
    if: needs.plan.outputs.draft != 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: "Checkout Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Dependency Review"
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          config-file: "./.github/dependency-review-config.yml"
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
          warn-only: true

  test:
    name: "Tests: ${{ matrix.label }}"
    needs: [plan]
    uses: ./.github/workflows/module.build.yml
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    secrets: inherit
    with:
      runner: ${{ matrix.runner }}
      label: ${{ matrix.label }}
      labs: ${{ matrix.labs }}
      main: ${{ matrix.main }}
      flags: ${{ matrix.flags }}
      coverage: ${{ matrix.coverage }}
